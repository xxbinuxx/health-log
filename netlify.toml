[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The morning brief. Cron is UTC, so it runs at both candidate hours and the
# function itself only sends when the clock in New York says 6am. That keeps it
# at 6am through daylight saving without any seasonal edits.
[functions."daily-brief"]
  schedule = "0 10,11 * * *"

# Garmin is pull-only, so something has to go and fetch. This one is deliberately NOT garmin-sync,
# which the browser calls: Netlify cannot invoke a scheduled function by URL.
#
# The aim is 11:00 New York time, once your sleep is done, then hourly until today's sleep has
# landed. Cron is UTC and the New York offset changes twice a year, so this fires at every UTC hour
# that could be 11:00-17:00 there (15:00-22:00 UTC covers both winter and summer) and the function
# checks the New York clock itself. Most invocations stop immediately.
[functions."garmin-nightly"]
  schedule = "0 15-22 * * *"

# Send every other path to the app so refreshing the page never 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
