[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The morning brief. Cron is UTC, so it runs at both candidate hours and the
# function itself only sends when the clock in New York says 6am. That keeps it
# at 6am through daylight saving without any seasonal edits.
[functions."daily-brief"]
  schedule = "0 10,11 * * *"

# Garmin is pull-only, so something has to go and fetch. Early morning New York time, an
# hour before the brief is written, so the email reads this morning's sleep.
[functions."garmin-sync"]
  schedule = "30 8,9 * * *"

# Send every other path to the app so refreshing the page never 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
